name: Client build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Community is currently an active user-owned local edit with a known
      # TypeScript lint failure. CI still checks every tracked Client source
      # file, and this temporary exclusion can be removed when that edit lands.
      - run: npm run lint:ci
      - run: npm test
      - run: npm run build
